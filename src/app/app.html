<ion-app>
  <ion-menu side="start" menuId="sidebar" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menú</ion-title>
        <ion-buttons slot="end">
          <ion-menu-button menu="sidebar"></ion-menu-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <div class="menu-scroll">
      @for (topico of topicos$ | async; track topico.id) {
        <ion-list>
          <ion-item class="menu-category">
            <ion-label>{{ topico.nombre }}</ion-label>
          </ion-item>
          @for (item of topico.items; track item) {
            <ion-item
              button
              [routerLink]="['/SearchResult']"
              [queryParams]="buildQueryParams(topico.id, item)"
              (click)="closeSidebar()"
            >
              <ion-label>{{ item }}</ion-label>
            </ion-item>
          }
        </ion-list>
      }

      <ion-list>
        <ion-item button routerLink="" (click)="closeSidebar()"><ion-label>Home</ion-label></ion-item>

        @if (!isLoggedIn) {
          <ion-item button routerLink="/Login" (click)="closeSidebar()"><ion-label>Iniciar Sesión</ion-label></ion-item>
        } @else {
          <ion-item button [routerLink]="['/UserProfile', currentUserId]" (click)="closeSidebar()"><ion-label>Mi Perfil</ion-label></ion-item>
          <ion-item button routerLink="/CreateProject" (click)="closeSidebar()"><ion-label>Crear Proyecto</ion-label></ion-item>
          <ion-item button [routerLink]="['/ManageProject', currentUserId]" (click)="closeSidebar()"><ion-label>Gestionar Proyecto</ion-label></ion-item>
          <ion-item button class="logout-btn" (click)="onLogout()"><ion-label>Cerrar Sesión</ion-label></ion-item>
        }
      </ion-list>
    </div>
  </ion-menu>
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
