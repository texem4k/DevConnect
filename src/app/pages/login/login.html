<ion-content id="main-content">
  <div class="login-page">
    <div class="sectionLayout">
      <div class="header">
        <ion-button fill="clear" (click)="goBack()">←</ion-button>
        <h1 class="title">Iniciar Sesión</h1>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form">

        <div class="form-group">
          <app-get-input-text
            label="Correo electrónico"
            type="email"
            [control]="loginForm.controls['email']"
            placeholder="Correo electrónico"
            [errorMessages]="{
              required: 'El correo es obligatorio.',
              email: 'El formato del correo no es válido.'
            }"
          />
        </div>

        <div class="form-group password-group">
          <app-get-input-text
            label="Contraseña"
            type="password"
            [control]="loginForm.controls['password']"
            placeholder="Contraseña"
            [errorMessages]="{
              required: 'La contraseña es obligatoria.',
              minlength: 'La contraseña debe tener al menos 8 caracteres.',
              pattern: 'Debe contener al menos una mayúscula, minúscula, un número y un carácter especial.'
            }"
          />
          <button type="button" class="toggle-password" (click)="togglePassword()">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>

        @if (generalError) {
          <ion-note color="danger" class="general-error">{{ generalError }}</ion-note>
        }

        <div class="button-row">
          <ion-button type="submit" [disabled]="loading">
            {{ loading ? 'Entrando...' : 'Iniciar sesión' }}
          </ion-button>
          <ion-button fill="outline" routerLink="/UserRegistration">
            Crear cuenta
          </ion-button>
        </div>

        <p class="helpText">
          Si surgió algún problema, ¡No dudes en avisarnos!
        </p>

        <div class="button-row">
          <ion-button fill="clear" routerLink="/Incidents">
            Incidencias
          </ion-button>
        </div>

      </form>
    </div>
  </div>
</ion-content>
