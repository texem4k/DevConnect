<body>

<!-- header -->

<img id="project-image" src="https://picsum.photos/1200/320?random=1" alt="Imagen Lorem Ipsum">

<div class="overlay-text">
  <h1>{{project?.title}}</h1>
  <a [routerLink]="['/UserProfile', id]" ]>{{project?.creator}}</a>
</div>

<div class="page-layout">
  <main class="main-content">
    <h3>Descripción del proyecto:</h3>
    <p>{{project!.description}}</p>
    <app-cards-grid
      [title]="'Colaboradores'"
      [isProject]="false"
      [items]="mantainers"></app-cards-grid>
  </main>

  <aside>
    <app-topics-grid [title]="'Tecnologías a usar'" [items]="project!.requirements.technologies"></app-topics-grid>
    <app-topics-grid [title]="'Requisitos adicionales'" [items]="project!.requirements.knowledgeAreas"></app-topics-grid>

    <h3>Inscripción</h3>
    <button id="inscription-button">Inscribirse</button>
  </aside>

</div>
</body>
