<app-header></app-header>
<ion-content id="main-content">
  @if(project){
    <ion-img id="project-image" [src]="project.image" alt="Imagen proyecto"></ion-img>

    <div class="overlay-text">
      <h1>{{project.title}}</h1>
      <a [routerLink]="['/UserProfile', id]">{{project.creator}}</a>
    </div>

    <div class="page-layout">
      <section class="main-content">
        <h3>Descripción del proyecto:</h3>
        <p>{{project!.description}}</p>
        <app-cards-grid
          [title]="'Colaboradores'"
          [isProject]="false"
          [items]="maintainers"></app-cards-grid>
      </section>

      <aside>
        <app-topics-grid [title]="'Requisitos'" [items]="project.requireTopic"></app-topics-grid>
        @if(isLoggedIn){
          <h3>Inscripción</h3>
          @if (isSubscribed$ | async) {
            <ion-button id="inscription-button" (click)="unSubscribe()">Cancelar Inscripción</ion-button>
          } @else {
            <ion-button id="inscription-button" (click)="subscribe()">Inscribirse</ion-button>
          }
        }
      </aside>
    </div>
  }
  <app-footer></app-footer>
</ion-content>
