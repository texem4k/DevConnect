<app-header></app-header>
<ion-content id="main-content">
  <app-banner></app-banner>
  <h2 class="introduction">Usuarios trending</h2>

  <section class="trendingUsers">
    @for (user of users?.slice(0,3); track user.uid) {
      <app-information-card tipo="usuario" [imagen]="user.Avatar" [titulo]="user.Fullname" [descripcion]="user.Description" [id]="user.uid" [topics]="user.Topic"/>
    }
  </section>
  <div class="discoverButton">
    <ion-button type="button" (click)="discoverUsers()">Más información</ion-button>
  </div>

  <br><br>

  <h2 class="introduction">Proyectos trending</h2>
  <section class="trendingProjects"><app-media-list [projects]="projects?.slice(0,4)!" [flat]="true"></app-media-list></section>

  <div class="discoverButton">
    <ion-button type="button" (click)="discoverProjects()">Más información</ion-button>
  </div>
  <app-footer></app-footer>
</ion-content>
