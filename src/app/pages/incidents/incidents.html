<app-header></app-header>
<main>
  <h1 class="title">¿Algún problema?</h1>
  <form [formGroup]="incidentsForm" (ngSubmit)="submitIncident()" class="form">

    <label class="field">
      <span class="field-label">Asunto del problema</span>
      <input type="text" formControlName="topic" placeholder="Asunto del problema">
      <p class="error">{{ topicError }}</p>
    </label>

    <label class="field">
      <span class="field-label">Correo de contacto</span>
      <input type="email" formControlName="email" placeholder="Correo">
      <p class="error">{{ emailError }}</p>
    </label>

    <label class="field field-large">
      <span class="field-label">Describe detalladamente el problema que tienes...</span>
      <textarea formControlName="text"></textarea>
      <p class="error">{{ textError }}</p>
    </label>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>

    <button type="submit" class="submit-btn" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Enviando...' : 'Enviar' }}
    </button>

  </form>
</main>
<app-footer></app-footer>
