<app-header></app-header>
<ion-content>
  <h1 class="title">¿Algún problema?</h1>
  <form [formGroup]="incidentsForm" (ngSubmit)="submitIncident()" class="form">

    <app-get-input-text
      label="Asunto del problema"
      [control]="incidentsForm.controls['topic']"
      placeholder="Asunto del problema"
      [errorMessages]="{
        required: 'El asunto es obligatorio.',
        minlength: 'El asunto debe tener al menos 5 caracteres.',
        maxlength: 'El asunto no puede superar los 50 caracteres.'
      }"
    ></app-get-input-text>

    <app-get-input-text
      label="Correo de contacto"
      type="email"
      [control]="incidentsForm.controls['email']"
      placeholder="Correo"
      [errorMessages]="{
        required: 'El correo es obligatorio.',
        email: 'Introduce un correo válido.'
      }"
    ></app-get-input-text>

    <div class="textarea-group">
      <ion-label class="field-label">Describe detalladamente el problema que tienes...</ion-label>
      <ion-textarea
        formControlName="text"
        rows="10"
        placeholder="Describe detalladamente el problema que tienes..."
        class="incident-textarea"
      ></ion-textarea>
    </div>
    @if (textError) {
      <ion-note color="danger">{{ textError }}</ion-note>
    }

    @if (errorMessage) {
      <ion-note color="danger">{{ errorMessage }}</ion-note>
    }
    @if (successMessage) {
      <ion-note color="success">{{ successMessage }}</ion-note>
    }

    <div class="button-row">
      <ion-button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Enviando...' : 'Enviar' }}
      </ion-button>
    </div>

  </form>
  <app-footer></app-footer>
</ion-content>
