<app-header></app-header>
<ion-content id="main-content">
  @if(projects){
    <div class="project-container">
      <app-media-list
        [projects]="projects!"
        [showActions]="true"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)">
      </app-media-list>
    </div>

    <app-pagination-component></app-pagination-component>
  }
  <app-footer></app-footer>
</ion-content>
