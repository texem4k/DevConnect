<div class="cardGrid">
  <h1>{{ title }}</h1>
  <section class="cardsSection">
    @for (item of itemsLimitados; track item.Id) {
      <app-information-card
        [id]="item.Id"
        [imagen]="item.Avatar"
        [titulo]="item.Fullname"
        [descripcion]="item.Description"
        [topics]="item.Topic.Specialty"
      />
    }
  </section>
</div>
