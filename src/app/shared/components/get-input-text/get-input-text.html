<ion-item>
  <ion-label position="floating">{{label}}</ion-label>
  <ion-input
    [formControl]="formControl"
    (ionBlur)="control.markAsTouched()"
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    [attr.min]="participantsField ? 2 : null"
    [attr.max]="participantsField ? 20 : null"
  ></ion-input>
</ion-item>

@if(control.invalid && control.touched){
  <ion-note color="danger">{{ getErrorMessage(formControl) }}</ion-note>
}
