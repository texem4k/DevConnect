<ion-list class="projectList">
  @for(item of getProjects; track item) {
    <app-media-component
      [project]="item"
      [showActions]="showActions"
      (edit)="handleEdit(item)"
      (delete)="handleDelete(item)"
    />
  }

  @for(item of getUsers; track item) {
    <app-media-component
      [user]="item"
    />
  }
</ion-list>
