<div class="projectList">
    @if(type=="projects"){
      @for(item of getProjects; track item){
        <app-media-component
          [imagen]="item.image"
          [titulo]="item.title"
          [descripcion]="item.description"
        />
      }
    }

    @else{
      @for(item of getUsers; track item){
        <app-media-component
          [imagen]="item.Avatar"
          [titulo]="item.Nickname"
          [descripcion]="item.Description"
        />
      }
    }

</div>
