<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../../templates/CSS/header.css">
    <link rel="stylesheet" href="../../templates/CSS/mediaList.css">
    <link rel="stylesheet" href="../../templates/CSS/paginationComponent.css">
    <link rel="stylesheet" href="../../templates/CSS/footer.css">
    <link rel="stylesheet" href="../CSS/searchResult.css">
    <script src="../../templates/JS/loadTemplate.js"></script>
</head>
<body>
    <header class="headerTemplate"></header>
    <div id="main-layout">
        <aside>
            <h3>Filtros</h3>
            <form class="filters-form">

                <!-- Categorías -->
                <div class="filter-group">
                    <h4>Categoría</h4>

                    <label>
                        <input type="checkbox" name="category" value="frontend">
                        Frontend
                    </label>

                    <label>
                        <input type="checkbox" name="category" value="backend">
                        Backend
                    </label>

                    <label>
                        <input type="checkbox" name="category" value="devops">
                        DevOps
                    </label>
                </div>

                <!-- Nivel -->
                <div class="filter-group">
                    <h4>Nivel</h4>

                    <label>
                        <input type="radio" name="level" value="junior">
                        Junior
                    </label>

                    <label>
                        <input type="radio" name="level" value="senior">
                        Senior
                    </label>
                </div>

                <!-- Orden -->
                <div class="filter-group">
                    <h4>Ordenar por:</h4>

                    <label>
                        <select name="sort">
                            <option value="recent">Más reciente</option>
                            <option value="popular">Más popular</option>
                        </select>
                    </label>
                </div>

                <!-- Botón aplicar -->
                <button type="submit" class="apply-btn">
                    Aplicar filtros
                </button>
                <button type="reset" class="clean-btn">
                    Limpiar filtros
                </button>
            </form>
        </aside>
        <div id="results">
            <div class="media-list"></div>
            <nav class="paginationComponentTemplate"></nav>
        </div>
    </div>
    <footer class="footerTemplate"></footer>

    <script src="../../templates/JS/header.js"></script>
    <script src="../../templates/JS/footer.js"></script>
    <script type="module" src="../JS/searchResult.js"></script>
</body>
</html>
